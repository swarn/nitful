[project]
name = "nitful"
version = "0.1.0"
description = "A parser library and command-line tool for NITF files."
readme = "README.md"
requires-python = ">= 3.12"
license = { text = "MIT" }
authors = [{name = "Seth Warn", email = "swarn@uark.edu"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Image Processing",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[dependency-groups]
dev = [
    "mypy>=1.20.0",
    "pytest>=9.0.3",
    "ruff>=0.15.10",
    "black>=26.3.1",
    "pyrefly>=0.60.2",
]

[project.urls]
Homepage = "https://github.com/swarn/nitful"
Issues = "https://github.com/swarn/nitful/issues"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project.scripts]
nitful = "nitful.cli:main"

[tool.hatch.build.targets.wheel]
exclude = [
    "tests",
]

[tool.black]
preview = true
enable-unstable-feature = [
    "hug_parens_with_braces_and_square_brackets",
]

[tool.mypy]
strict = true
python_version = "3.12"
warn_unreachable = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
disable_error_code = ["var-annotated"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",        # ignore docstrings for now
    "CPY",      # ignore copyright for now
    "DOC201",   # ignore return type in docstrings for now
    "DOC501",   # ignore exceptions in dosctring for now
    "TD",       # ignore TODO checks
    "FIX002",   # "
    "COM812",   # let the formatter handle commas
    "PLW0108",  # ignore lambdas with single call
    "TC001",    # no type-checking block by default
    "TC002",    # "
    "TC003",    # "
    "TC006",    # unquoted types in casts
    "TRY003",   # long exception messages
    "PTH123",   # don't force Path.open()
    "PLC1901",  # explicit empty string checks are OK
    "FBT003",   # allow boolean positional arguments
    "ANN401",   # avoiding Any is difficult while parsing
    "B905",     # allow zip without strict parameter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",     # assert
    "T201",     # print
    "ANN",      # ignore type annotation
    "PLR2004",  # allow magic values
]

"**/__init__.py" = [
    "F401",     # unused variables
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.pyrefly]
python-version = "3.12.0"
